# Город -> операторы. Для каждого оператора: откуда брать адрес->группа (address)
# и графики (schedule). Новый город = новая запись; новый тип источника = новый provider.
operators:
  dtek_dnem:
    name: ДТЕК Дніпровські електромережі
    schedule: {provider: yasno, region_id: 3, dso_id: 301}
  cek:
    name: ЦЕК (Центральна енергетична компанія)
    schedule: {provider: yasno, region_id: 3, dso_id: 303}
  zoe:
    name: Запоріжжяобленерго
    schedule: {provider: zoe_site, url: "https://www.zoe.com.ua/outage/"}

cities:
  dnipro:
    name: Дніпро
    renames: renames/dnipro.yaml
    operators:
      - operator: dtek_dnem
        address: {provider: yasno, region_id: 3, dso_id: 301, city_id: 6}
      - operator: cek
        address: {provider: cek_site, city: "м. Дніпро"}
  pokrov:
    name: Покров
    renames: renames/pokrov.yaml
    operators:
      - operator: dtek_dnem
        address: {provider: yasno, region_id: 3, dso_id: 301, city_id: 20}
